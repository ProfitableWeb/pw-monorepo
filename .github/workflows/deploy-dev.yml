name: Deploy Dev

on:
  push:
    branches: [develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'docker-compose.dev.yml'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

# Деплои одного контура идут строго по очереди, без отмены начатого.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    name: Deploy to dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${SSH_PORT:-22} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Write env and deploy
        run: |
          # Формируем .env.dev локально (надёжнее чем echo -e через pipe)
          ENV_FILE=$(mktemp)
          {
            echo "POSTGRES_DB=profitableweb_dev"
            echo "POSTGRES_USER=pw"
            echo "POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}"
            [ -n "$DEV_JWT_SECRET" ]     && echo "JWT_SECRET=${DEV_JWT_SECRET}"
            echo "FRONTEND_URL=http://dev.profitableweb.ru"
            echo "ADMIN_URL=http://dev.profitableweb.ru/admin"
            echo "CORS_ORIGINS=[\"http://dev.profitableweb.ru\"]"
            [ -n "$STORAGE_BACKEND" ]    && echo "STORAGE_BACKEND=${STORAGE_BACKEND}"
            [ -n "$S3_ENDPOINT" ]        && echo "S3_ENDPOINT=${S3_ENDPOINT}"
            [ -n "$S3_BUCKET" ]          && echo "S3_BUCKET=${S3_BUCKET}"
            [ -n "$S3_ACCESS_KEY" ]      && echo "S3_ACCESS_KEY=${S3_ACCESS_KEY}"
            [ -n "$S3_SECRET_KEY" ]      && echo "S3_SECRET_KEY=${S3_SECRET_KEY}"
            [ -n "$S3_REGION" ]          && echo "S3_REGION=${S3_REGION}"
            [ -n "$S3_PUBLIC_ENDPOINT" ] && echo "S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT}"
          } > "$ENV_FILE"

          # Отдельный рабочий каталог dev (PW-064): prod живёт в ~/profitableweb
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} \
              "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/profitableweb-dev"

          # Копируем файл на сервер через scp (атомарно, надёжнее pipe)
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -P ${SSH_PORT:-22} \
              "$ENV_FILE" "${SSH_USER}@${SSH_HOST}:~/profitableweb-dev/.env.dev"
          rm -f "$ENV_FILE"

          # Деплой (ServerAliveInterval не даёт SSH отвалиться во время docker build)
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -p ${SSH_PORT:-22} \
              ${SSH_USER}@${SSH_HOST} "DEPLOY_SHA=${GITHUB_SHA} bash -ls" << 'EOF'
            set -e

            cd ~/profitableweb-dev

            # Первый деплой в отдельный каталог: инициализируем репозиторий
            # с тем же remote, что у prod (та же авторизация на GitHub)
            if [ ! -d .git ]; then
              git init -q
              git remote add origin "$(git -C ~/profitableweb remote get-url origin)"
            fi

            # Проверяем что .env.dev содержит POSTGRES_PASSWORD
            grep -q "POSTGRES_PASSWORD=." .env.dev || { echo "ERROR: .env.dev missing POSTGRES_PASSWORD"; exit 1; }

            # Обновление кода (ветка develop)
            git fetch origin
            # Ровно тот коммит, на котором прошёл CI (PW-064)
            git cat-file -e "${DEPLOY_SHA}^{commit}" || { echo "ERROR: commit ${DEPLOY_SHA} not found"; exit 1; }
            git checkout -f --detach "$DEPLOY_SHA"

            # Сборка и запуск dev-контейнеров
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build --remove-orphans

            # Проверка здоровья (PW-064): с сервера, напрямую в контейнеры и через nginx.
            # Повторы — API после up -d сначала применяет миграции. Провал = красный деплой.
            wait_for() {
              local url=$1; shift
              for _ in $(seq 1 30); do
                if curl -fsS -o /dev/null "$@" "$url"; then echo "OK: $url $*"; return 0; fi
                sleep 5
              done
              echo "ERROR: $url $* не отвечает"; return 1
            }
            wait_for http://127.0.0.1:8100/health
            wait_for http://127.0.0.1:3100/
            wait_for http://127.0.0.1:3101/admin/
            wait_for http://127.0.0.1/api/categories -H "Host: dev.profitableweb.ru"

            echo "Dev deploy completed: ${DEPLOY_SHA}"
          EOF
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          DEV_JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          STORAGE_BACKEND: ${{ secrets.STORAGE_BACKEND }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_ENDPOINT: ${{ secrets.S3_PUBLIC_ENDPOINT }}
